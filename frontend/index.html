<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KrishiMitra - Mandi Price & Market Estimator</title>
  <meta name="description" content="Discover highest net return across mandis by factoring real transport and market costs.">
  
  <!-- Google Fonts: Poppins for crisp high-contrast readability -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top App Header with Brand and Language Pills -->
  <header class="app-header">
    <div class="header-container">
      <a href="/" class="brand-wrapper">
        <span class="brand-icon">🌾</span>
        <div>
          <h1 class="brand-title" data-i18n="appTitle">KrishiMitra</h1>
          <p class="brand-subtitle" data-i18n="appSubtitle">Mandi Price & Transport Estimator</p>
        </div>
      </a>

      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <a href="/buyer" class="btn btn-outline" style="min-height: 32px; padding: 2px 10px; font-size: 0.8rem; background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.4); width: auto;">
          🛒 Buyer Market
        </a>

        <!-- Multilingual Language Toggle -->
        <div class="lang-selector" role="group" aria-label="Language Selector">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="hi">हिन्दी</button>
          <button class="lang-btn" data-lang="mr">मराठी</button>
        </div>

        <!-- Settings Icon Link -->
        <a href="/settings" class="nav-settings-btn" title="Settings" aria-label="Settings">
          ⚙️
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-content">

    <!-- Live Market Alert Ticker -->
    <div class="alert-ticker">
      <span class="ticker-icon">📢</span>
      <span id="notificationTickerText" data-i18n="tickerDefault">
        🔥 Live: Highest price discovery active across Vidarbha APMCs
      </span>
    </div>

    <!-- Farmer Input Card (Screen 1) -->
    <section class="card" aria-labelledby="inputFormHeading">
      <form id="marketInputForm">
        
        <!-- 1. Select Crop Dropdown -->
        <div class="form-group">
          <label for="cropSelect" class="form-label">
            <span class="label-icon">🌱</span>
            <span data-i18n="selectCropLabel">Select Your Crop</span>
          </label>
          <div class="select-wrapper">
            <select id="cropSelect" class="form-select" required aria-required="true">
              <option value="" disabled selected>Loading crops...</option>
            </select>
          </div>
        </div>

        <!-- 2. Home Mandi Dropdown -->
        <div class="form-group">
          <label for="homeMandiSelect" class="form-label">
            <span class="label-icon">📍</span>
            <span data-i18n="selectMandiLabel">Your Home Mandi / Village</span>
          </label>
          <div class="select-wrapper">
            <select id="homeMandiSelect" class="form-select" required aria-required="true">
              <option value="" disabled selected>Loading mandis...</option>
            </select>
          </div>
        </div>

        <!-- 3. Quantity Input (Quintals) -->
        <div class="form-group">
          <label for="quantityInput" class="form-label">
            <span class="label-icon">⚖️</span>
            <span data-i18n="quantityLabel">Estimated Harvest Quantity</span>
          </label>
          <div class="input-suffix-wrapper">
            <input type="number" id="quantityInput" class="form-input" value="10" min="0.5" step="0.5" required>
            <span class="input-suffix" data-i18n="quantitySuffix">Quintals</span>
          </div>

          <!-- Quick Quantity Selection Pills -->
          <div class="quick-qty-pills">
            <span class="quick-select-label" style="font-size:0.85rem; color:var(--text-light); align-self:center;" data-i18n="quickSelectLabel">Quick Select:</span>
            <button type="button" class="qty-pill" data-qty="5">5 Qtl</button>
            <button type="button" class="qty-pill active" data-qty="10">10 Qtl</button>
            <button type="button" class="qty-pill" data-qty="25">25 Qtl</button>
            <button type="button" class="qty-pill" data-qty="50">50 Qtl</button>
            <button type="button" class="qty-pill" data-qty="100">100 Qtl</button>
          </div>
        </div>

        <!-- Primary Action Button -->
        <button type="submit" class="btn btn-primary" id="findMarketBtn" style="margin-top: 1.5rem;">
          <span data-i18n="submitBtn">🔍 Find Best Market Return</span>
        </button>

      </form>
    </section>

    <!-- System Details Footer -->
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      <p style="font-weight: 700;">KrishiMitra • Agricultural Market Discovery & Direct Procurement</p>
    </div>

  </main>

  <!-- Script logic -->
  <script src="/js/app.js"></script>
</body>
</html>
